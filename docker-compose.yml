# lodestone split by network requirement:
#   * lodestone-crawler: host networking, so the DHT crawler's UDP works
#     (Docker Desktop's bridge NAT breaks DHT hash discovery). It also runs its
#     own HTTP server on :3335 for metrics / health / pprof.
#   * lodestone-web:     bridge networking with a published port, so the Web UI
#     / GraphQL API is reachable from the Mac (incl. its Tailscale IP). It also
#     runs the queue/classifier.
#   * lodestone-crawler-metrics: socat bridge, publishes the crawler's :3335
#     (host-networked containers cannot publish ports themselves).
# Both lodestone processes share the same Postgres.
services:
  lodestone-crawler:
    container_name: lodestone-crawler
    image: ghcr.io/ghobs91/lodestone:latest
    volumes:
      - ./config:/root/.config/lodestone
      - ./data/lodestone:/root/.local/share/lodestone
    restart: unless-stopped
    network_mode: host
    environment:
      - POSTGRES_HOST=localhost
      - POSTGRES_PASSWORD=postgres
      # Crawler's own HTTP server (metrics/health/pprof) on a second port.
      - HTTP_SERVER_LOCAL_ADDRESS=:13335
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - worker
      - run
      - --keys
      - dht_crawler
      - --keys
      - http_server

  lodestone-web:
    container_name: lodestone-web
    image: ghcr.io/ghobs91/lodestone:latest
    volumes:
      - ./config:/root/.config/lodestone
      - ./data/lodestone:/root/.local/share/lodestone
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - worker
      - run
      - --keys
      - http_server
      - --keys
      - queue_server

  # Publish the host-networked crawler's :3335. It is reachable from the
  # compose network at the docker bridge gateway; update the IP if the
  # lodestone_default subnet changes.
  lodestone-crawler-metrics:
    container_name: lodestone-crawler-metrics
    image: alpine/socat
    restart: unless-stopped
    ports:
      - "3335:3335"
    depends_on:
      - lodestone-crawler
    command:
      - TCP-LISTEN:3335,fork,reuseaddr
      - TCP:172.18.0.1:13335

  postgres:
    image: postgres:16-alpine
    container_name: lodestone-postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5432:5432"
    shm_size: 1g
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lodestone
      - PGUSER=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      start_period: 20s
