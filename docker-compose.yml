# ---------------------------------------------------------------------------
# Kernel tuning (run on the Docker host before starting Lodestone):
#
#   sysctl -w net.netfilter.nf_conntrack_max=262144
#   sysctl -w net.netfilter.nf_conntrack_udp_timeout=30
#   sysctl -w net.netfilter.nf_conntrack_udp_timeout_stream=60
#   sysctl -w net.ipv4.ip_local_port_range="1024 65535"
#
# These prevent Lodestone's DHT crawling from saturating the conntrack
# table and starving other Docker containers of network connectivity.
# See README.md for details on why these matter.
# ---------------------------------------------------------------------------

services:
  lodestone:
    container_name: lodestone
    image: ghcr.io/ghobs91/lodestone:latest
    volumes:
      - ./config:/root/.config/lodestone
      - ./data/lodestone:/root/.local/share/lodestone
    restart: unless-stopped
    # Host networking bypasses Docker's NAT/masquerading, which eliminates the
    # per-flow conntrack entries that Lodestone's high-volume DHT traffic would
    # otherwise create. This prevents the conntrack table from filling up and
    # breaking connectivity for every other container on the host.
    network_mode: host
    environment:
      # With host networking, postgres is reachable via localhost.
      - POSTGRES_HOST=localhost
      - POSTGRES_PASSWORD=postgres
      # - TMDB_API_KEY=your_api_key
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - worker
      - run
      - --all

  postgres:
    image: postgres:16-alpine
    container_name: lodestone-postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    # Expose postgres to the host so the lodestone container (running with
    # network_mode: host) can reach it via localhost:5432.
    ports:
      - "5432:5432"
    shm_size: 1g
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lodestone
      - PGUSER=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      start_period: 20s
